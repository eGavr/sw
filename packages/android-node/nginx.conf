worker_processes 1;
events { worker_connections 256; }

# The single WebDriver-node surface the sw control plane talks to (port 4444), fronting the two backing
# services in the shared network namespace: Appium (the WebDriver server) and — when recording/interactive
# is enabled — websockify (the VNC bridge). `/status` is the Selenium-Grid-shaped document the heartbeat
# agent polls.
http {
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    server {
        listen 4444;

        location = /status { proxy_pass http://127.0.0.1:4445; }

        location ~ ^/session/[^/]+/se/vnc$ {
            # No URI part: nginx forbids it in a regex location; websockify upgrades on any path.
            proxy_pass http://127.0.0.1:7900;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:4723;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;
        }
    }
}
