# Minimum-cost single-host deploy of the sw control plane.
#
# One small amd64 Compute VM runs everything the service needs: Postgres co-located with the four service
# processes (all one image, different commands). ENVIRONMENTS ARE NOT RUN HERE — the worker provisions them
# separately on demand (android → on-demand YC Compute VMs from the golden image; browser → a docker/k8s
# compute backend), so the always-on cost is just this one VM.
#
# The service processes use host networking so the worker reaches the YC metadata service (169.254.169.254)
# for its SA token and env VMs reach the internal callback at http://<this-vm-private-ip>:3002. Postgres stays
# on loopback only (127.0.0.1:5432) — never exposed on the VM's public IP. Required env: POSTGRES_PASSWORD,
# INTERNAL_API_SECRET, SW_IMAGE. For OIDC set AUTH_STRATEGY=oidc + OIDC_* (else the cheap local stub, which
# is refused when NODE_ENV=production — keep NODE_ENV=staging for the local-auth bring-up).
x-service-env: &service-env
  NODE_ENV: ${NODE_ENV:-staging}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-sw}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_DATABASE: ${POSTGRES_DATABASE:-sw}
  POSTGRES_SSL: "false"
  AUTH_STRATEGY: ${AUTH_STRATEGY:-local}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
  OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
  OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
  # Ports mirror local dev: frontend 3000 (user-facing), api 4000, wd 3001, internal 3002.
  API_PORT: "4000"
  WD_PORT: "3001"
  INTERNAL_PORT: "3002"
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET}
  # On-demand Android env VMs (redroid). The worker authenticates to the YC API with this VM's SA token from
  # the metadata service; env VMs call back to the internal API at COMPUTE_ANDROID_INTERNAL_URL.
  COMPUTE_ANDROID_IMAGE_ID: ${COMPUTE_ANDROID_IMAGE_ID:-fd8opcrg042a3lu6u90e}
  COMPUTE_ANDROID_ZONE: ${COMPUTE_ANDROID_ZONE:-ru-central1-a}
  COMPUTE_ANDROID_SUBNET_ID: ${COMPUTE_ANDROID_SUBNET_ID:-e9bcp55uhm61e0jln645}
  COMPUTE_ANDROID_SECURITY_GROUP_ID: ${COMPUTE_ANDROID_SECURITY_GROUP_ID:-enpktcul739o27mqntlp}
  COMPUTE_ANDROID_FOLDER_ID: ${COMPUTE_ANDROID_FOLDER_ID:?set COMPUTE_ANDROID_FOLDER_ID}
  COMPUTE_ANDROID_DEFAULT_VERSION: ${COMPUTE_ANDROID_DEFAULT_VERSION:-13}
  COMPUTE_ANDROID_DISK_GB: ${COMPUTE_ANDROID_DISK_GB:-40}
  COMPUTE_ANDROID_MEMORY_GB: ${COMPUTE_ANDROID_MEMORY_GB:-16}
  COMPUTE_ANDROID_INTERNAL_URL: ${COMPUTE_ANDROID_INTERNAL_URL:?set to http://<this-vm-private-ip>:3002}
  # Android boots slowly: keep the provisioning lease and heartbeat window generous.
  WORKER_PREPARING_TIMEOUT_MS: ${WORKER_PREPARING_TIMEOUT_MS:-360000}
  HEARTBEAT_FRESHNESS_MS: ${HEARTBEAT_FRESHNESS_MS:-120000}
  # Browser (docker) env compute: the worker runs stock selenium containers on the host's docker (socket
  # mounted into the worker below). The browser node reaches the internal API at COMPUTE_DOCKER_INTERNAL_URL
  # (the docker bridge gateway routes to the host); wd reaches the published node port on the loopback.
  COMPUTE_DOCKER_IMAGE: ${COMPUTE_DOCKER_IMAGE:-selenium/standalone-chrome:latest}
  COMPUTE_DOCKER_INTERNAL_URL: ${COMPUTE_DOCKER_INTERNAL_URL:-http://172.17.0.1:3002}
  COMPUTE_DOCKER_ADVERTISE_HOST: ${COMPUTE_DOCKER_ADVERTISE_HOST:-127.0.0.1}
  # Session artifacts (logs/video) → S3-compatible storage when LOG_STORAGE=s3. Credentials are the service's
  # OWN delegated identity (SDK default chain reads AWS_*); the user's bucket grants that identity access — we
  # never hold the user's secrets. The bucket/endpoint/region are per project (registered as StorageDestination).
  # Which clouds this install offers (CSV; unset = all known). The milestone deploy sets `yandex-cloud`.
  CLOUD_CATALOG: ${CLOUD_CATALOG:-}
  # The install's published service accounts users grant roles to on their own cloud (delegated BYOC);
  # surfaced in GET /v1/cloudTypes so the Connect form can show what to grant.
  YC_DELEGATION_COMPUTE_SA_ID: ${YC_DELEGATION_COMPUTE_SA_ID:-}
  YC_DELEGATION_STORAGE_SA_ID: ${YC_DELEGATION_STORAGE_SA_ID:-}
  # Browser env VMs (yandex-cloud linux/container): on-demand Compute VMs from the linux-node golden.
  # A project's cloud-account config (folderId/subnet/…) overrides these install defaults per environment.
  COMPUTE_BROWSER_IMAGE_ID: ${COMPUTE_BROWSER_IMAGE_ID:-}
  COMPUTE_BROWSER_ZONE: ${COMPUTE_BROWSER_ZONE:-ru-central1-a}
  COMPUTE_BROWSER_SUBNET_ID: ${COMPUTE_BROWSER_SUBNET_ID:-}
  COMPUTE_BROWSER_SECURITY_GROUP_ID: ${COMPUTE_BROWSER_SECURITY_GROUP_ID:-}
  COMPUTE_BROWSER_FOLDER_ID: ${COMPUTE_BROWSER_FOLDER_ID:-}
  COMPUTE_BROWSER_NODE_IMAGE: ${COMPUTE_BROWSER_NODE_IMAGE:-}
  COMPUTE_BROWSER_INTERNAL_URL: ${COMPUTE_BROWSER_INTERNAL_URL:-}
  LOG_STORAGE: ${LOG_STORAGE:-memory}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE:-sw}
    volumes:
      - sw-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sw} -d ${POSTGRES_DATABASE:-sw}"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    image: ${SW_IMAGE:?set SW_IMAGE}
    network_mode: host
    environment: *service-env
    # Direct node invocation: `pnpm run` would make corepack fetch pnpm from npmjs at runtime, which the
    # RU VM cannot reach. The hoisted layout (.npmrc node-linker=hoisted) puts the CLI at /repo/node_modules.
    command: ["node", "/repo/node_modules/typeorm/cli.js", "migration:run", "-d", "build/src/infrastructure/data-sources/database/postgres/typeorm/migration/index.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${SW_IMAGE:?set SW_IMAGE}
    network_mode: host
    environment: *service-env
    command: ["node", "build/src/presentation/http/api/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  wd:
    image: ${SW_IMAGE:?set SW_IMAGE}
    network_mode: host
    environment: *service-env
    command: ["node", "build/src/presentation/http/wd/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  internal:
    image: ${SW_IMAGE:?set SW_IMAGE}
    network_mode: host
    environment: *service-env
    command: ["node", "build/src/presentation/http/internal/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ${SW_IMAGE:?set SW_IMAGE}
    network_mode: host
    # root + the host docker socket so the docker compute adapter can run browser env containers on this VM
    # (docker-out-of-docker). Only the worker provisions, so only it needs the socket.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment: *service-env
    command: ["node", "build/src/presentation/worker/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The dashboard (Next.js + Auth.js BFF) — the user-facing surface on :3000. Server-side it proxies to
  # the api on the loopback; the browser-facing wd URL is baked into the image at build time (see
  # apps/frontend/Dockerfile). Auth goes to the co-located Keycloak realm (keycloak-compose.yml).
  frontend:
    image: ${SW_FRONTEND_IMAGE:?set SW_FRONTEND_IMAGE}
    network_mode: host
    environment:
      PORT: "3000"
      # Host networking hands the container the VM's hostname; the standalone server would bind to it
      # (unreachable) instead of every interface.
      HOSTNAME: 0.0.0.0
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:?set to http://<vm-public-ip>:3000}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID:-sw-web}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:?set AUTH_KEYCLOAK_SECRET}
      AUTH_KEYCLOAK_ISSUER: ${AUTH_KEYCLOAK_ISSUER:?set to http://<vm-public-ip>:8085/realms/sw}
      SW_API_URL: http://127.0.0.1:4000
      SW_WD_URL: http://127.0.0.1:3001
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  sw-pgdata:
