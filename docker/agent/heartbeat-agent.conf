; Priority 20 — starts after the selenium standalone node (priority 15). autorestart keeps the
; agent alive across transient failures so the environment never stops heartbeating while it lives.

[program:heartbeat-agent]
priority=20
command=/opt/bin/heartbeat-agent.sh
autostart=true
autorestart=true
startsecs=0
startretries=3

redirect_stderr=true
stdout_logfile=/var/log/supervisor/heartbeat-agent-stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
