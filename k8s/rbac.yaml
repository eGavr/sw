# Least-privilege access for the worker running in-cluster: it may only manage environment pods and
# their services in the environments namespace (create/delete/list/get), nothing else. Bind this SA to
# the worker Deployment (spec.serviceAccountName) when deploying to a real cluster; local dev on the
# host uses the admin kubeconfig, so this is applied for parity/verification.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sw-worker
  namespace: sw-environments
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sw-environment-manager
  namespace: sw-environments
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sw-worker-environment-manager
  namespace: sw-environments
subjects:
  - kind: ServiceAccount
    name: sw-worker
    namespace: sw-environments
roleRef:
  kind: Role
  name: sw-environment-manager
  apiGroup: rbac.authorization.k8s.io
