# Proof-of-concept config: in-cluster Postgres (postgres-poc.yaml), TLS off. Apply this INSTEAD of
# config.yaml for a PoC. For production use config.yaml (Managed PostgreSQL, TLS on).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sw-config
  namespace: sw
data:
  LOG_LEVEL: "log,warn,error,fatal"
  AUTH_STRATEGY: "local"
  API_PORT: "3000"
  WD_PORT: "3001"
  INTERNAL_PORT: "3002"
  POSTGRES_HOST: "sw-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "sw"
  POSTGRES_DATABASE: "sw"
  POSTGRES_SSL: "false"
  COMPUTE_K8S_NETWORKING: "cluster-dns"
  COMPUTE_K8S_NAMESPACE: "sw-environments"
  # Yandex Cloud nodes are amd64 → real Chrome. (On an arm dev cluster use seleniarm/standalone-chromium.)
  COMPUTE_K8S_IMAGE: "selenium/standalone-chrome:latest"
  COMPUTE_K8S_INTERNAL_URL: "http://sw-internal.sw.svc.cluster.local:3002"
  # Session-log uploads go to an S3-compatible backend (Yandex Object Storage). The bucket/endpoint/region
  # are per-account (registered via the storageDestination API); access is delegated — the control plane
  # authenticates with OUR service-account key (AWS_* in the secret), never the user's credentials.
  LOG_STORAGE: "s3"
---
apiVersion: v1
kind: Secret
metadata:
  name: sw-secrets
  namespace: sw
type: Opaque
stringData:
  # PoC placeholders — fine for a throwaway PoC; generate real values for anything real.
  INTERNAL_API_SECRET: "poc-internal-secret"
  POSTGRES_PASSWORD: "poc-postgres-password"
  # Our service-account static key for Yandex Object Storage (delegated log uploads). Left empty in the
  # repo — never commit real keys; set them at deploy time (kubectl patch/create secret from a yc SA key).
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
