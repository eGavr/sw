# Local Kubernetes dev cluster for the kubernetes compute adapter (env = Pod + NodePort Service).
# The node-port range is mapped to the host so the wd proxy reaches env pods on 127.0.0.1:<nodePort>,
# the same way Docker publishes a container port. Set up:
#
#   kind create cluster --config k8s/kind-cluster.yaml
#   docker build -t sw/environment-agent:latest docker/agent   # if not built yet
#   kind load docker-image sw/environment-agent:latest --name sw
#
# Then run the worker with COMPUTE_K8S_CONTEXT=kind-sw (set in env/.env.development) and create an
# account with resources.providerType=kubernetes. Tear down: kind delete cluster --name sw
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sw
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30000, hostPort: 30000, listenAddress: "127.0.0.1" }
      - { containerPort: 30001, hostPort: 30001, listenAddress: "127.0.0.1" }
      - { containerPort: 30002, hostPort: 30002, listenAddress: "127.0.0.1" }
      - { containerPort: 30003, hostPort: 30003, listenAddress: "127.0.0.1" }
      - { containerPort: 30004, hostPort: 30004, listenAddress: "127.0.0.1" }
      - { containerPort: 30005, hostPort: 30005, listenAddress: "127.0.0.1" }
